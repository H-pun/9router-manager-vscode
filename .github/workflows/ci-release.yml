name: CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json
      - run: npm ci
      - run: npm ci --prefix webview-ui
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require(\"./package.json\").version')"
      - name: Package VSIX
        run: |
          VERSION="$(node -p 'require(\"./package.json\").version')"
          npx vsce package --out "9router-${VERSION}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: 9router-vsix
          path: 9router-*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: 9router-vsix
          path: release-assets
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/*.vsix --title "9Router $GITHUB_REF_NAME" --generate-notes